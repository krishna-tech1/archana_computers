version: "2"
sql:
    - engine: "postgresql"
      queries: "queries"
      schema: "migrations"
      gen:
          go:
              package: "sqlc"
              out: "../internal/db/sqlc"
              sql_package: "pgx/v5"
              emit_interface: true
              emit_json_tags: true
              overrides:
                  - db_type: "uuid"
                    go_type:
                        import: "github.com/google/uuid"
                        type: "UUID"
